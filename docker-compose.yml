version: '3.8'

services:
  compiler:
    build: .
    ports:
      - "8000:8000"
    environment:
      - JUDGE0_KEY=${JUDGE0_KEY:-}
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# Run with: docker-compose up
# Access at: http://localhost:8000
